name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ctxr version
      description: Output of `ctxr --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and shell
      placeholder: e.g. macOS 15 / zsh 5.9, Windows 11 / PowerShell 7.4
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error output if any.
